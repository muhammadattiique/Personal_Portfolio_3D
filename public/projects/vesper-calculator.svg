<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="vesperGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C6FF3D" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#141419" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181F"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#0A0A0C"/>
  <rect width="1600" height="1000" fill="url(#vesperGlow)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1000" y1="0" x2="1000" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
    <line x1="1400" y1="0" x2="1400" y2="1000"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
  </g>

  <!-- Window Frame -->
  <g filter="url(#shadowFilter)">
    <rect x="220" y="110" width="1160" height="780" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect x="220" y="110" width="1160" height="54" rx="16" fill="#121216"/>
    <rect x="220" y="148" width="1160" height="16" fill="#121216"/>
    <line x1="220" y1="164" x2="1380" y2="164" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <circle cx="260" cy="137" r="6" fill="#FF5F56"/>
    <circle cx="282" cy="137" r="6" fill="#FFBD2E"/>
    <circle cx="304" cy="137" r="6" fill="#27C93F"/>
    
    <text x="800" y="142" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E" text-anchor="middle" letter-spacing="0.1em">VESPER SPATIAL CALCULATOR • WEBGL 3D OPTICS</text>
    <rect x="1300" y="126" width="56" height="22" rx="4" fill="rgba(198,255,61,0.1)"/>
    <text x="1328" y="141" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C6FF3D" font-weight="600" text-anchor="middle">60 FPS</text>
    
    <!-- Calculator Body inside viewport -->
    <g transform="translate(480, 210)">
      <!-- Spatial Chamber -->
      <rect x="0" y="0" width="640" height="630" rx="12" fill="#0C0C0E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      
      <!-- Display Screen -->
      <rect x="36" y="36" width="568" height="140" rx="8" fill="#131317" stroke="rgba(198,255,61,0.2)" stroke-width="1"/>
      <text x="60" y="72" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8A8A8E">sin(45°) × √2 + (π / 2)</text>
      <text x="576" y="142" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="700" fill="#EDEDED" text-anchor="end">2.5707963</text>
      
      <!-- Keypad Grid -->
      <g transform="translate(36, 210)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="124" height="68" rx="8" fill="#18181E" stroke="rgba(255,255,255,0.08)"/>
        <text x="62" y="42" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8A8A8E" text-anchor="middle">AC</text>
        <rect x="148" y="0" width="124" height="68" rx="8" fill="#18181E" stroke="rgba(255,255,255,0.08)"/>
        <text x="210" y="42" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8A8A8E" text-anchor="middle">RAD</text>
        <rect x="296" y="0" width="124" height="68" rx="8" fill="#18181E" stroke="rgba(255,255,255,0.08)"/>
        <text x="358" y="42" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8A8A8E" text-anchor="middle">%</text>
        <rect x="444" y="0" width="124" height="68" rx="8" fill="rgba(198,255,61,0.12)" stroke="#C6FF3D" stroke-width="1"/>
        <text x="506" y="42" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C6FF3D" font-weight="600" text-anchor="middle">÷</text>

        <!-- Row 2 -->
        <rect x="0" y="86" width="124" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="62" y="128" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">7</text>
        <rect x="148" y="86" width="124" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="210" y="128" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">8</text>
        <rect x="296" y="86" width="124" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="358" y="128" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">9</text>
        <rect x="444" y="86" width="124" height="68" rx="8" fill="rgba(198,255,61,0.12)" stroke="#C6FF3D" stroke-width="1"/>
        <text x="506" y="128" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C6FF3D" font-weight="600" text-anchor="middle">×</text>

        <!-- Row 3 -->
        <rect x="0" y="172" width="124" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="62" y="214" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">4</text>
        <rect x="148" y="172" width="124" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="210" y="214" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">5</text>
        <rect x="296" y="172" width="124" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="358" y="214" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">6</text>
        <rect x="444" y="172" width="124" height="68" rx="8" fill="rgba(198,255,61,0.12)" stroke="#C6FF3D" stroke-width="1"/>
        <text x="506" y="214" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C6FF3D" font-weight="600" text-anchor="middle">−</text>

        <!-- Row 4 -->
        <rect x="0" y="258" width="124" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="62" y="300" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">1</text>
        <rect x="148" y="258" width="124" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="210" y="300" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">2</text>
        <rect x="296" y="258" width="124" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="358" y="300" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">3</text>
        <rect x="444" y="258" width="124" height="68" rx="8" fill="rgba(198,255,61,0.12)" stroke="#C6FF3D" stroke-width="1"/>
        <text x="506" y="300" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C6FF3D" font-weight="600" text-anchor="middle">+</text>

        <!-- Row 5 -->
        <rect x="0" y="344" width="272" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="136" y="386" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">0</text>
        <rect x="296" y="344" width="124" height="68" rx="8" fill="#1E1E26" stroke="rgba(255,255,255,0.08)"/>
        <text x="358" y="386" font-family="'JetBrains Mono', monospace" font-size="20" fill="#EDEDED" font-weight="600" text-anchor="middle">.</text>
        <rect x="444" y="344" width="124" height="68" rx="8" fill="#C6FF3D"/>
        <text x="506" y="386" font-family="'JetBrains Mono', monospace" font-size="22" fill="#0A0A0C" font-weight="700" text-anchor="middle">=</text>
      </g>
    </g>
  </g>

  <!-- Editorial Badge Watermark -->
  <text x="80" y="940" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#8A8A8E" letter-spacing="0.1em">01 / CASE STUDY</text>
  <text x="1520" y="940" font-family="'JetBrains Mono', monospace" font-size="14" fill="#C6FF3D" text-anchor="end">REACT • THREE.JS • AUDIO SYNTH</text>
</svg>

