<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="airGlow" cx="50%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#121832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="airCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2142"/><stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>
    <linearGradient id="airAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="airShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0B1020"/>
  <rect width="1600" height="1000" fill="url(#airGlow)"/>

  <!-- flight path -->
  <path d="M220 720 Q700 200 1360 300" fill="none" stroke="rgba(79,140,255,0.4)" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round"/>
  <circle cx="220" cy="720" r="10" fill="#4F8CFF"/>
  <circle cx="1360" cy="300" r="10" fill="#A855F7"/>

  <!-- airplane -->
  <g filter="url(#airShadow)" transform="translate(620,340) rotate(-18)">
    <path d="M0 60 L300 40 L360 60 L300 80 L0 100 Z" fill="url(#airAccent)"/>
    <path d="M90 40 L150 -40 L180 -40 L150 40 Z" fill="#4F8CFF"/>
    <path d="M90 120 L150 200 L180 200 L150 120 Z" fill="#4F8CFF"/>
    <path d="M300 40 L350 10 L365 20 L330 55 Z" fill="#A855F7"/>
    <g fill="#0B1020" opacity="0.4"><circle cx="120" cy="70" r="7"/><circle cx="150" cy="70" r="7"/><circle cx="180" cy="70" r="7"/><circle cx="210" cy="70" r="7"/></g>
  </g>

  <!-- boarding pass -->
  <g filter="url(#airShadow)" transform="translate(300,620)">
    <rect x="0" y="0" width="640" height="200" rx="18" fill="url(#airCard)" stroke="rgba(255,255,255,0.12)"/>
    <line x1="460" y1="0" x2="460" y2="200" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="36" y="56" font-family="'JetBrains Mono', monospace" font-size="14" fill="#9AA3C7" letter-spacing="0.1em">BOARDING PASS</text>
    <text x="36" y="116" font-family="'Space Grotesk', sans-serif" font-size="40" fill="#F2F4FF" font-weight="800">ISB</text>
    <text x="210" y="116" font-family="'Space Grotesk', sans-serif" font-size="30" fill="#4F8CFF">&#8594;</text>
    <text x="270" y="116" font-family="'Space Grotesk', sans-serif" font-size="40" fill="#F2F4FF" font-weight="800">DXB</text>
    <text x="36" y="160" font-family="'JetBrains Mono', monospace" font-size="15" fill="#9AA3C7">SEAT 14A &#183; GATE B3 &#183; INTL</text>
    <g transform="translate(490,40)" fill="#C7D0F0">
      <rect x="0" y="0" width="4" height="120"/><rect x="10" y="0" width="8" height="120"/><rect x="24" y="0" width="4" height="120"/><rect x="34" y="0" width="10" height="120"/><rect x="50" y="0" width="4" height="120"/><rect x="60" y="0" width="8" height="120"/><rect x="74" y="0" width="4" height="120"/><rect x="84" y="0" width="10" height="120"/><rect x="100" y="0" width="6" height="120"/><rect x="114" y="0" width="4" height="120"/>
    </g>
  </g>

  <text x="80" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#9AA3C7" letter-spacing="0.1em">AIRLINE MANAGEMENT SYSTEM</text>
  <text x="1520" y="930" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4F8CFF" text-anchor="end">C++ &#183; OOP &#183; BOOKING</text>
</svg>
