<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="ecGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#121832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ecCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2142"/>
      <stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>
    <linearGradient id="ecAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="ecShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0B1020"/>
  <rect width="1600" height="1000" fill="url(#ecGlow)"/>
  <g stroke="rgba(255,255,255,0.035)" stroke-width="1">
    <line x1="400" y1="0" x2="400" y2="1000"/><line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/><line x1="0" y1="500" x2="1600" y2="500"/>
  </g>

  <!-- Storefront window -->
  <g filter="url(#ecShadow)">
    <rect x="300" y="170" width="1000" height="620" rx="20" fill="url(#ecCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="300" y="170" width="1000" height="70" rx="20" fill="#141B38"/>
    <rect x="300" y="222" width="1000" height="18" fill="#141B38"/>
    <text x="356" y="214" font-family="'JetBrains Mono', monospace" font-size="15" fill="#9AA3C7" letter-spacing="0.08em">marketplace.store</text>
    <rect x="1120" y="186" width="130" height="36" rx="18" fill="rgba(79,140,255,0.14)"/>
    <text x="1185" y="210" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4F8CFF" text-anchor="middle">CART (3)</text>

    <!-- product cards -->
    <g transform="translate(348,290)">
      <g>
        <rect x="0" y="0" width="270" height="200" rx="14" fill="#101733" stroke="rgba(255,255,255,0.08)"/>
        <rect x="24" y="24" width="222" height="104" rx="10" fill="url(#ecAccent)" opacity="0.85"/>
        <rect x="24" y="146" width="150" height="14" rx="7" fill="#2A3356"/>
        <rect x="24" y="170" width="90" height="12" rx="6" fill="#4F8CFF"/>
      </g>
      <g transform="translate(300,0)">
        <rect x="0" y="0" width="270" height="200" rx="14" fill="#101733" stroke="rgba(255,255,255,0.08)"/>
        <rect x="24" y="24" width="222" height="104" rx="10" fill="#A855F7" opacity="0.7"/>
        <rect x="24" y="146" width="130" height="14" rx="7" fill="#2A3356"/>
        <rect x="24" y="170" width="90" height="12" rx="6" fill="#4F8CFF"/>
      </g>
      <g transform="translate(600,0)">
        <rect x="0" y="0" width="270" height="200" rx="14" fill="#101733" stroke="rgba(255,255,255,0.08)"/>
        <rect x="24" y="24" width="222" height="104" rx="10" fill="#4F8CFF" opacity="0.75"/>
        <rect x="24" y="146" width="160" height="14" rx="7" fill="#2A3356"/>
        <rect x="24" y="170" width="90" height="12" rx="6" fill="#4F8CFF"/>
      </g>
    </g>

    <!-- cart summary -->
    <g transform="translate(348,520)">
      <rect x="0" y="0" width="904" height="210" rx="14" fill="#0E1430" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="80" cy="105" r="46" fill="rgba(79,140,255,0.12)"/>
      <path d="M58 86 h44 l-6 34 h-32 z M64 128 a6 6 0 1 0 0.1 0 M98 128 a6 6 0 1 0 0.1 0" fill="none" stroke="#4F8CFF" stroke-width="4" stroke-linejoin="round"/>
      <text x="160" y="92" font-family="'Space Grotesk', sans-serif" font-size="26" fill="#F2F4FF" font-weight="700">Order Summary</text>
      <text x="160" y="132" font-family="'JetBrains Mono', monospace" font-size="16" fill="#9AA3C7">3 items &#183; Checkout ready</text>
      <rect x="664" y="66" width="200" height="78" rx="12" fill="url(#ecAccent)"/>
      <text x="764" y="113" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#0B1020" font-weight="700" text-anchor="middle">Place Order</text>
    </g>
  </g>

  <text x="80" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#9AA3C7" letter-spacing="0.1em">E-COMMERCE MARKETPLACE</text>
  <text x="1520" y="930" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4F8CFF" text-anchor="end">JAVA &#183; SPRING BOOT &#183; REST</text>
</svg>
