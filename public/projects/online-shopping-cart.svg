<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="cartGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#121832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cartCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2142"/><stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>
    <linearGradient id="cartAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="cartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0B1020"/>
  <rect width="1600" height="1000" fill="url(#cartGlow)"/>

  <!-- big cart -->
  <g filter="url(#cartShadow)" transform="translate(360,300)">
    <path d="M0 40 L90 40 L170 380 L560 380 L640 130 L140 130" fill="none" stroke="url(#cartAccent)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="210" cy="440" r="42" fill="#141B38" stroke="#4F8CFF" stroke-width="10"/>
    <circle cx="510" cy="440" r="42" fill="#141B38" stroke="#4F8CFF" stroke-width="10"/>
    <!-- items in cart -->
    <rect x="210" y="180" width="110" height="110" rx="12" fill="#4F8CFF" opacity="0.85"/>
    <rect x="340" y="180" width="110" height="110" rx="12" fill="#A855F7" opacity="0.8"/>
    <rect x="470" y="200" width="90" height="90" rx="12" fill="#16A34A" opacity="0.8"/>
    <circle cx="560" cy="60" r="34" fill="url(#cartAccent)"/>
    <text x="560" y="72" font-family="'Space Grotesk', sans-serif" font-size="30" fill="#0B1020" font-weight="800" text-anchor="middle">+</text>
  </g>

  <!-- price tags -->
  <g filter="url(#cartShadow)" transform="translate(1060,330)">
    <rect x="0" y="0" width="360" height="90" rx="14" fill="url(#cartCard)" stroke="rgba(255,255,255,0.12)"/>
    <text x="28" y="56" font-family="'Space Grotesk', sans-serif" font-size="24" fill="#F2F4FF" font-weight="700">Subtotal</text>
    <text x="332" y="56" font-family="'JetBrains Mono', monospace" font-size="22" fill="#4F8CFF" text-anchor="end">$149.00</text>
    <rect x="0" y="110" width="360" height="90" rx="14" fill="url(#cartCard)" stroke="rgba(255,255,255,0.12)"/>
    <text x="28" y="166" font-family="'Space Grotesk', sans-serif" font-size="24" fill="#F2F4FF" font-weight="700">Items</text>
    <text x="332" y="166" font-family="'JetBrains Mono', monospace" font-size="22" fill="#A855F7" text-anchor="end">3</text>
    <rect x="0" y="230" width="360" height="86" rx="14" fill="url(#cartAccent)"/>
    <text x="180" y="284" font-family="'Space Grotesk', sans-serif" font-size="24" fill="#0B1020" font-weight="800" text-anchor="middle">Checkout</text>
  </g>

  <text x="80" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#9AA3C7" letter-spacing="0.1em">ONLINE SHOPPING CART</text>
  <text x="1520" y="930" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4F8CFF" text-anchor="end">HTML &#183; JS &#183; PHP &#183; MYSQL</text>
</svg>
