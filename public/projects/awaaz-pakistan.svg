<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="awaazGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#121832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="awaazCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2142"/><stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>
    <linearGradient id="awaazAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/><stop offset="100%" stop-color="#4F8CFF"/>
    </linearGradient>
    <filter id="awaazShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0B1020"/>
  <rect width="1600" height="1000" fill="url(#awaazGlow)"/>

  <!-- sound waves -->
  <g fill="none" stroke="#16A34A" stroke-width="4" opacity="0.5" stroke-linecap="round">
    <path d="M900 500 q90 -90 0 -180"/><path d="M970 500 q150 -150 0 -300"/>
    <path d="M900 500 q90 90 0 180"/><path d="M970 500 q150 150 0 300"/>
  </g>
  <g fill="none" stroke="#4F8CFF" stroke-width="4" opacity="0.4" stroke-linecap="round">
    <path d="M1040 500 q210 -210 0 -420"/><path d="M1040 500 q210 210 0 420"/>
  </g>

  <!-- megaphone -->
  <g filter="url(#awaazShadow)" transform="translate(330,360)">
    <path d="M0 80 L0 200 L120 200 L420 300 L420 -20 L120 80 Z" fill="url(#awaazAccent)"/>
    <rect x="-70" y="80" width="80" height="120" rx="14" fill="#141B38" stroke="rgba(255,255,255,0.12)"/>
    <rect x="130" y="200" width="70" height="120" rx="12" fill="#1A2142"/>
    <circle cx="420" cy="140" r="16" fill="#0B1020" opacity="0.3"/>
  </g>

  <!-- community badge -->
  <g filter="url(#awaazShadow)" transform="translate(300,720)">
    <rect x="0" y="0" width="560" height="110" rx="18" fill="url(#awaazCard)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="60" cy="55" r="26" fill="#16A34A"/><circle cx="104" cy="55" r="26" fill="#4F8CFF"/><circle cx="148" cy="55" r="26" fill="#A855F7"/>
    <text x="210" y="48" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#F2F4FF" font-weight="700">Open-Source Community</text>
    <text x="210" y="82" font-family="'JetBrains Mono', monospace" font-size="15" fill="#9AA3C7">Hacktoberfest &#183; issues &amp; PRs</text>
  </g>

  <text x="80" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#9AA3C7" letter-spacing="0.1em">AWAAZ PAKISTAN</text>
  <text x="1520" y="930" font-family="'JetBrains Mono', monospace" font-size="14" fill="#16A34A" text-anchor="end">OPEN SOURCE &#183; CIVIC TECH</text>
</svg>
