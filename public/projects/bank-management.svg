      <!-- Bottom Console Prompt -->
      <g transform="translate(0, 530)">
        <rect x="0" y="0" width="1120" height="52" rx="8" fill="#131318" stroke="rgba(255,255,255,0.08)"/>
        <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="13" fill="#C6FF3D">[IO_STREAM] Persistent ledger bin sync OK &gt; flush() executed across 4 records.</text>
      </g>
