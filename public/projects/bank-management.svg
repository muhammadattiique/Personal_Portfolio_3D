  </g>

  <!-- Editorial Badge Watermark -->
  <text x="80" y="950" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#8A8A8E" letter-spacing="0.1em">03 / CASE STUDY</text>
  <text x="1520" y="950" font-family="'JetBrains Mono', monospace" font-size="14" fill="#C6FF3D" text-anchor="end">C++ • OOP • BINARY DATA STREAMS</text>
</svg>

