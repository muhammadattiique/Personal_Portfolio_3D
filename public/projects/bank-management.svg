          <text x="148" y="0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">Tariq Mansoor</text>
          <text x="408" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E">Corporate Escrow</text>
          <text x="648" y="0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">$1,020,000.00</text>
          <rect x="888" y="-14" width="70" height="22" rx="4" fill="rgba(198,255,61,0.1)"/>
          <text x="923" y="1" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C6FF3D" font-weight="600" text-anchor="middle">VERIFIED</text>
        </g>
        <line x1="20" y1="214" x2="1100" y2="214" stroke="rgba(255,255,255,0.04)"/>

        <g transform="translate(32, 248)">
          <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#C6FF3D">#TX-94813</text>
          <text x="148" y="0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">Sophia Chen</text>
          <text x="408" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E">Standard Checking</text>
          <text x="648" y="0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">$59,250.38</text>
          <rect x="888" y="-14" width="70" height="22" rx="4" fill="rgba(198,255,61,0.1)"/>
          <text x="923" y="1" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C6FF3D" font-weight="600" text-anchor="middle">VERIFIED</text>
        </g>
