      <g transform="translate(385, 0)">
        <rect x="0" y="0" width="350" height="100" rx="10" fill="#121217" stroke="rgba(198,255,61,0.2)"/>
        <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A8E">PERSISTENT LEDGER NODES</text>
        <text x="24" y="70" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#C6FF3D">1,248 ACTIVE ACCOUNTS</text>
