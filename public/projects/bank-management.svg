<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bankGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C6FF3D" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#141419" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181820"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
    <filter id="shadowFilter3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#0A0A0C"/>
  <rect width="1600" height="1000" fill="url(#bankGlow)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="900" y1="0" x2="900" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
  </g>

  <!-- Main Software Interface Window -->
  <g filter="url(#shadowFilter3)">
    <rect x="200" y="100" width="1200" height="800" rx="16" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect x="200" y="100" width="1200" height="54" rx="16" fill="#121216"/>
    <rect x="200" y="138" width="1200" height="16" fill="#121216"/>
    <line x1="200" y1="154" x2="1400" y2="154" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <circle cx="240" cy="127" r="6" fill="#FF5F56"/>
    <circle cx="262" cy="127" r="6" fill="#FFBD2E"/>
    <circle cx="284" cy="127" r="6" fill="#27C93F"/>
    
    <text x="800" y="132" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E" text-anchor="middle" letter-spacing="0.1em">BANK CORE TRANSACTION SYSTEM • C++ OOP &amp; STREAMS</text>
    <rect x="1300" y="116" width="76" height="22" rx="4" fill="rgba(198,255,61,0.1)"/>
    <text x="1338" y="131" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C6FF3D" font-weight="600" text-anchor="middle">ACID READY</text>

    <!-- Content Area: Top metrics, middle ledger table, bottom transaction inspector -->
    <g transform="translate(240, 190)">
      <!-- 3 Metrics Cards -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="350" height="100" rx="10" fill="#121217" stroke="rgba(255,255,255,0.08)"/>
        <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A8E">TOTAL VAULT ASSETS</text>
        <text x="24" y="70" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#EDEDED">$1,482,900.50</text>
