        <line x1="0" y1="46" x2="1120" y2="46" stroke="rgba(255,255,255,0.08)"/>
        <text x="32" y="29" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8A8A8E">TX_ID</text>
