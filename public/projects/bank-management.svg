          <text x="148" y="0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">Alexander Wright</text>
          <text x="408" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E">Premium Savings</text>
          <text x="648" y="0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">$84,250.00</text>
          <rect x="888" y="-14" width="70" height="22" rx="4" fill="rgba(198,255,61,0.1)"/>
          <text x="923" y="1" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C6FF3D" font-weight="600" text-anchor="middle">VERIFIED</text>
        </g>
        <line x1="20" y1="102" x2="1100" y2="102" stroke="rgba(255,255,255,0.04)"/>

        <g transform="translate(32, 136)">
          <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#C6FF3D">#TX-94811</text>
          <text x="148" y="0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">Elena Rostova</text>
          <text x="408" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E">Commercial Checking</text>
          <text x="648" y="0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">$319,400.12</text>
          <rect x="888" y="-14" width="70" height="22" rx="4" fill="rgba(198,255,61,0.1)"/>
          <text x="923" y="1" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C6FF3D" font-weight="600" text-anchor="middle">VERIFIED</text>
        </g>
        <line x1="20" y1="158" x2="1100" y2="158" stroke="rgba(255,255,255,0.04)"/>

        <g transform="translate(32, 192)">
