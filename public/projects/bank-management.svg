<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bankGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#121832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bankCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2142"/><stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>
    <linearGradient id="bankAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="bankShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0B1020"/>
  <rect width="1600" height="1000" fill="url(#bankGlow)"/>
  <g stroke="rgba(255,255,255,0.035)" stroke-width="1">
    <line x1="400" y1="0" x2="400" y2="1000"/><line x1="1200" y1="0" x2="1200" y2="1000"/>
  </g>

  <!-- bank building -->
  <g filter="url(#bankShadow)" transform="translate(300,210)">
    <!-- roof pediment -->
    <path d="M60 150 L370 40 L680 150 Z" fill="url(#bankAccent)" opacity="0.9"/>
    <rect x="40" y="150" width="660" height="26" rx="4" fill="#1A2142"/>
    <!-- columns -->
    <g fill="#141B38" stroke="rgba(255,255,255,0.08)">
      <rect x="80" y="190" width="56" height="300" rx="6"/>
      <rect x="220" y="190" width="56" height="300" rx="6"/>
      <rect x="360" y="190" width="56" height="300" rx="6"/>
      <rect x="500" y="190" width="56" height="300" rx="6"/>
      <rect x="604" y="190" width="56" height="300" rx="6"/>
    </g>
    <rect x="40" y="500" width="660" height="34" rx="4" fill="#1A2142"/>
    <text x="370" y="120" font-family="'Space Grotesk', sans-serif" font-size="40" fill="#0B1020" font-weight="800" text-anchor="middle">BANK</text>
  </g>

  <!-- account / transaction card -->
  <g filter="url(#bankShadow)" transform="translate(1020,300)">
    <rect x="0" y="0" width="420" height="260" rx="18" fill="url(#bankCard)" stroke="rgba(255,255,255,0.12)"/>
    <text x="32" y="52" font-family="'JetBrains Mono', monospace" font-size="14" fill="#9AA3C7" letter-spacing="0.1em">ACCOUNT #100482</text>
    <text x="32" y="118" font-family="'Space Grotesk', sans-serif" font-size="44" fill="#F2F4FF" font-weight="800">$ 24,860.00</text>
    <rect x="32" y="150" width="356" height="1" fill="rgba(255,255,255,0.1)"/>
    <text x="32" y="192" font-family="'Space Grotesk', sans-serif" font-size="17" fill="#4F8CFF">+ Deposit  $ 500.00</text>
    <text x="32" y="226" font-family="'Space Grotesk', sans-serif" font-size="17" fill="#A855F7">&#8722; Withdraw  $ 120.00</text>
    <circle cx="372" cy="200" r="16" fill="rgba(79,140,255,0.14)"/>
  </g>

  <text x="80" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#9AA3C7" letter-spacing="0.1em">BANK MANAGEMENT SYSTEM</text>
  <text x="1520" y="930" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4F8CFF" text-anchor="end">C++ &#183; OOP &#183; FILE HANDLING</text>
</svg>
