<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="chatGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#121832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="chatCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2142"/><stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>
    <linearGradient id="chatAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="chatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0B1020"/>
  <rect width="1600" height="1000" fill="url(#chatGlow)"/>

  <!-- server node + client connection lines -->
  <g stroke="rgba(79,140,255,0.3)" stroke-width="2" fill="none">
    <line x1="800" y1="500" x2="330" y2="250"/><line x1="800" y1="500" x2="330" y2="760"/>
    <line x1="800" y1="500" x2="1270" y2="250"/><line x1="800" y1="500" x2="1270" y2="760"/>
  </g>
  <g fill="#4F8CFF">
    <circle cx="520" cy="383" r="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="383" r="5"/><circle cx="520" cy="627" r="5"/><circle cx="1080" cy="627" r="5"/>
  </g>

  <!-- chat window -->
  <g filter="url(#chatShadow)">
    <rect x="470" y="230" width="660" height="540" rx="20" fill="url(#chatCard)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="470" y="230" width="660" height="64" rx="20" fill="#141B38"/>
    <rect x="470" y="278" width="660" height="16" fill="#141B38"/>
    <circle cx="506" cy="262" r="6" fill="#FF5F56"/><circle cx="528" cy="262" r="6" fill="#FFBD2E"/><circle cx="550" cy="262" r="6" fill="#27C93F"/>
    <text x="800" y="267" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9AA3C7" text-anchor="middle" letter-spacing="0.08em">chat-server :: 4 clients</text>

    <!-- message bubbles -->
    <g transform="translate(500,320)">
      <rect x="0" y="0" width="300" height="56" rx="14" fill="#101733" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="30" cy="28" r="14" fill="#4F8CFF"/><text x="54" y="34" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#C7D0F0">Ali: hey everyone</text>
      <rect x="300" y="78" width="300" height="56" rx="14" fill="url(#chatAccent)"/>
      <circle cx="330" cy="106" r="14" fill="#0B1020" opacity="0.4"/><text x="354" y="112" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#0B1020" font-weight="600">You: broadcasting...</text>
      <rect x="0" y="156" width="340" height="56" rx="14" fill="#101733" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="30" cy="184" r="14" fill="#A855F7"/><text x="54" y="190" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#C7D0F0">Sara: real-time works!</text>
      <rect x="260" y="234" width="340" height="56" rx="14" fill="url(#chatAccent)"/>
      <text x="430" y="268" font-family="'JetBrains Mono', monospace" font-size="15" fill="#0B1020" text-anchor="middle">thread per client &#9889;</text>
    </g>

    <!-- input -->
    <rect x="500" y="690" width="600" height="52" rx="26" fill="#0E1430" stroke="rgba(255,255,255,0.1)"/>
    <text x="528" y="723" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#5A6291">Type a message...</text>
    <circle cx="1070" cy="716" r="22" fill="url(#chatAccent)"/>
    <path d="M1061 716 l18 -7 l-7 7 l7 7 z" fill="#0B1020"/>
  </g>

  <text x="80" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#9AA3C7" letter-spacing="0.1em">MULTI-CLIENT CHAT</text>
  <text x="1520" y="930" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4F8CFF" text-anchor="end">PYTHON &#183; SOCKETS &#183; THREADS</text>
</svg>
