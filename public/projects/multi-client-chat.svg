<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="chatGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C6FF3D" stop-opacity="0.09"/>
      <stop offset="60%" stop-color="#141419" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161C"/>
      <stop offset="100%" stop-color="#0D0D11"/>
    </linearGradient>
    <filter id="shadowFilter2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#0A0A0C"/>
  <rect width="1600" height="1000" fill="url(#chatGlow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
    <line x1="1400" y1="0" x2="1400" y2="1000"/>
  </g>

  <!-- Terminal / Chat Server Window -->
  <g filter="url(#shadowFilter2)">
    <rect x="200" y="100" width="1200" height="800" rx="16" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect x="200" y="100" width="1200" height="54" rx="16" fill="#121216"/>
    <rect x="200" y="138" width="1200" height="16" fill="#121216"/>
    <line x1="200" y1="154" x2="1400" y2="154" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <circle cx="240" cy="127" r="6" fill="#FF5F56"/>
    <circle cx="262" cy="127" r="6" fill="#FFBD2E"/>
    <circle cx="284" cy="127" r="6" fill="#27C93F"/>
    
    <text x="800" y="132" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E" text-anchor="middle" letter-spacing="0.1em">TCP MULTI-CLIENT SOCKET SERVER • PYTHON CONCURRENCY</text>
    <rect x="1300" y="116" width="76" height="22" rx="4" fill="rgba(198,255,61,0.1)"/>
    <text x="1338" y="131" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C6FF3D" font-weight="600" text-anchor="middle">LIVE SOCKET</text>

    <!-- Split Screen: Left Sidebar (Active Nodes) & Right Main Terminal -->
    <g transform="translate(200, 154)">
      <!-- Left sidebar -->
      <rect x="0" y="0" width="320" height="746" fill="#0F0F13"/>
      <line x1="320" y1="0" x2="320" y2="746" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      
      <text x="32" y="44" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8A8A8E" letter-spacing="0.15em">CONNECTED CLIENTS [4]</text>
      
      <!-- Client items -->
      <g transform="translate(32, 70)">
        <rect x="0" y="0" width="256" height="56" rx="8" fill="#181820" stroke="rgba(198,255,61,0.2)"/>
        <circle cx="20" cy="28" r="4" fill="#C6FF3D"/>
        <text x="36" y="26" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">Client_Alpha (127.0.0.1)</text>
        <text x="36" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A8E">PORT: 55201 • Thread #1</text>
      </g>
      <g transform="translate(32, 140)">
        <rect x="0" y="0" width="256" height="56" rx="8" fill="#141419" stroke="rgba(255,255,255,0.06)"/>
        <circle cx="20" cy="28" r="4" fill="#C6FF3D"/>
        <text x="36" y="26" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">Client_Beta (192.168.1.14)</text>
        <text x="36" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A8E">PORT: 55202 • Thread #2</text>
      </g>
      <g transform="translate(32, 210)">
        <rect x="0" y="0" width="256" height="56" rx="8" fill="#141419" stroke="rgba(255,255,255,0.06)"/>
        <circle cx="20" cy="28" r="4" fill="#C6FF3D"/>
        <text x="36" y="26" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">Client_Gamma (10.0.4.88)</text>
        <text x="36" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A8E">PORT: 55203 • Thread #3</text>
      </g>
      <g transform="translate(32, 280)">
        <rect x="0" y="0" width="256" height="56" rx="8" fill="#141419" stroke="rgba(255,255,255,0.06)"/>
        <circle cx="20" cy="28" r="4" fill="#C6FF3D"/>
        <text x="36" y="26" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#EDEDED">Admin_Observer</text>
        <text x="36" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A8E">PORT: 55204 • Thread #4</text>
      </g>

      <!-- Server stats card -->
      <g transform="translate(32, 540)">
        <rect x="0" y="0" width="256" height="150" rx="8" fill="#121217" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A8E">BUFFER CAPACITY</text>
        <text x="20" y="58" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#EDEDED">4096 BYTES</text>
        <text x="20" y="96" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A8E">LATENCY METRIC</text>
        <text x="20" y="122" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#C6FF3D">&lt; 0.8 ms</text>
      </g>

      <!-- Right Main Terminal Stream -->
      <g transform="translate(350, 36)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" fill="#C6FF3D">$ python server.py --host 0.0.0.0 --port 9000 --threads 16</text>
        <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E">[INFO] Socket created on AF_INET, SOCK_STREAM. Bind successful.</text>
        <text x="0" y="56" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E">[INFO] Server listening on 0.0.0.0:9000 with backlog queue 20.</text>
        <text x="0" y="96" font-family="'JetBrains Mono', monospace" font-size="13" fill="#EDEDED">[STREAM] &lt;Client_Alpha&gt; joined channel #main (Thread ID: 0x7fa2b)</text>
        <text x="0" y="124" font-family="'JetBrains Mono', monospace" font-size="13" fill="#EDEDED">[STREAM] &lt;Client_Beta&gt; joined channel #main (Thread ID: 0x7fa2c)</text>
        
        <!-- Broadcast Message Box -->
        <rect x="0" y="150" width="800" height="88" rx="8" fill="#181822" stroke="rgba(255,255,255,0.08)"/>
        <text x="24" y="184" font-family="'JetBrains Mono', monospace" font-size="13" fill="#C6FF3D">[BROADCAST PACKET: MSG_RELAY]</text>
        <text x="24" y="212" font-family="'JetBrains Mono', monospace" font-size="15" fill="#EDEDED">Client_Alpha &gt;&gt; "Distributed consensus state synchronized across all socket channels."</text>

        <text x="0" y="274" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E">[ACK] Dispatched payload to 3 peer sockets in 0.42ms without lock contention.</text>
        <text x="0" y="304" font-family="'JetBrains Mono', monospace" font-size="13" fill="#EDEDED">[STREAM] &lt;Client_Beta&gt; received payload, checksum SHA256 verified.</text>
        <text x="0" y="334" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A8A8E">[HEARTBEAT] Ping sent to all active descriptors; 0 drops recorded.</text>

        <!-- Command input prompt at bottom -->
        <rect x="0" y="580" width="800" height="52" rx="8" fill="#121216" stroke="rgba(255,255,255,0.1)"/>
        <text x="20" y="612" font-family="'JetBrains Mono', monospace" font-size="14" fill="#C6FF3D">&gt; broadcast --channel #main --priority high "Status: All streams operational"</text>
        <rect x="734" y="598" width="8" height="18" fill="#C6FF3D"/>
      </g>
    </g>
  </g>

  <!-- Editorial Badge Watermark -->
  <text x="80" y="950" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#8A8A8E" letter-spacing="0.1em">02 / CASE STUDY</text>
  <text x="1520" y="950" font-family="'JetBrains Mono', monospace" font-size="14" fill="#C6FF3D" text-anchor="end">PYTHON • RAW SOCKETS • THREAD POOLS</text>
</svg>

