<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="libGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#121832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="libCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2142"/><stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>
    <linearGradient id="libAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="libShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0B1020"/>
  <rect width="1600" height="1000" fill="url(#libGlow)"/>

  <!-- bookshelf -->
  <g filter="url(#libShadow)" transform="translate(320,250)">
    <rect x="-30" y="0" width="720" height="500" rx="18" fill="url(#libCard)" stroke="rgba(255,255,255,0.12)"/>
    <line x1="-30" y1="250" x2="690" y2="250" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <!-- top row books -->
    <g transform="translate(10,40)">
      <rect x="0" y="0" width="46" height="180" rx="5" fill="#4F8CFF"/>
      <rect x="54" y="20" width="46" height="160" rx="5" fill="#A855F7"/>
      <rect x="108" y="10" width="46" height="170" rx="5" fill="#16A34A"/>
      <rect x="162" y="30" width="60" height="150" rx="5" fill="#2A3356"/>
      <rect x="230" y="0" width="46" height="180" rx="5" fill="#4F8CFF" opacity="0.7"/>
      <rect x="284" y="24" width="46" height="156" rx="5" fill="#A855F7" opacity="0.8"/>
      <rect x="338" y="8" width="60" height="172" rx="5" fill="#F2F4FF" opacity="0.85"/>
      <rect x="406" y="18" width="46" height="162" rx="5" fill="#4F8CFF"/>
      <rect x="460" y="0" width="60" height="180" rx="5" fill="#A855F7"/>
      <rect x="528" y="26" width="46" height="154" rx="5" fill="#16A34A" opacity="0.8"/>
      <rect x="582" y="10" width="46" height="170" rx="5" fill="#2A3356"/>
    </g>
    <!-- bottom row books -->
    <g transform="translate(10,290)">
      <rect x="0" y="20" width="60" height="160" rx="5" fill="#A855F7" opacity="0.8"/>
      <rect x="68" y="0" width="46" height="180" rx="5" fill="#4F8CFF"/>
      <rect x="122" y="14" width="46" height="166" rx="5" fill="#16A34A"/>
      <rect x="176" y="0" width="60" height="180" rx="5" fill="#F2F4FF" opacity="0.85"/>
      <rect x="244" y="26" width="46" height="154" rx="5" fill="#2A3356"/>
      <rect x="298" y="10" width="46" height="170" rx="5" fill="#4F8CFF" opacity="0.7"/>
      <rect x="352" y="0" width="60" height="180" rx="5" fill="#A855F7"/>
      <rect x="420" y="20" width="46" height="160" rx="5" fill="#16A34A" opacity="0.8"/>
      <rect x="474" y="6" width="46" height="174" rx="5" fill="#4F8CFF"/>
      <rect x="528" y="0" width="60" height="180" rx="5" fill="#2A3356"/>
      <rect x="596" y="22" width="34" height="158" rx="5" fill="#A855F7"/>
    </g>
  </g>

  <!-- borrow status -->
  <g filter="url(#libShadow)" transform="translate(1080,330)">
    <rect x="0" y="0" width="340" height="340" rx="18" fill="url(#libCard)" stroke="rgba(255,255,255,0.12)"/>
    <text x="28" y="56" font-family="'JetBrains Mono', monospace" font-size="14" fill="#9AA3C7" letter-spacing="0.1em">CATALOG</text>
    <g font-family="'Space Grotesk', sans-serif" font-size="18">
      <circle cx="40" cy="104" r="8" fill="#16A34A"/><text x="64" y="110" fill="#C7D0F0">Available &#183; 128</text>
      <circle cx="40" cy="158" r="8" fill="#4F8CFF"/><text x="64" y="164" fill="#C7D0F0">Borrowed &#183; 42</text>
      <circle cx="40" cy="212" r="8" fill="#A855F7"/><text x="64" y="218" fill="#C7D0F0">Members &#183; 64</text>
    </g>
    <rect x="28" y="256" width="284" height="56" rx="12" fill="url(#libAccent)"/>
    <text x="170" y="292" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#0B1020" font-weight="700" text-anchor="middle">Issue Book</text>
  </g>

  <text x="80" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#9AA3C7" letter-spacing="0.1em">LIBRARY MANAGEMENT SYSTEM</text>
  <text x="1520" y="930" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4F8CFF" text-anchor="end">PHP &#183; MYSQL &#183; AUTH</text>
</svg>
