<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="snakeGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#121832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="snakeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2142"/><stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>
    <filter id="snakeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0B1020"/>
  <rect width="1600" height="1000" fill="url(#snakeGlow)"/>

  <!-- game board -->
  <g filter="url(#snakeShadow)" transform="translate(470,190)">
    <rect x="0" y="0" width="660" height="620" rx="20" fill="url(#snakeCard)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="30" y="70" width="600" height="520" rx="10" fill="#0C1226" stroke="rgba(79,140,255,0.2)"/>
    <!-- scoreboard -->
    <text x="54" y="48" font-family="'JetBrains Mono', monospace" font-size="18" fill="#16A34A" font-weight="700">SCORE 120</text>
    <text x="606" y="48" font-family="'JetBrains Mono', monospace" font-size="18" fill="#A855F7" text-anchor="end" font-weight="700">HIGH 340</text>
    <!-- subtle grid -->
    <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
      <line x1="150" y1="70" x2="150" y2="590"/><line x1="270" y1="70" x2="270" y2="590"/><line x1="390" y1="70" x2="390" y2="590"/><line x1="510" y1="70" x2="510" y2="590"/>
      <line x1="30" y1="190" x2="630" y2="190"/><line x1="30" y1="310" x2="630" y2="310"/><line x1="30" y1="430" x2="630" y2="430"/>
    </g>
    <!-- snake body -->
    <g fill="#16A34A">
      <rect x="150" y="310" width="48" height="48" rx="10"/>
      <rect x="206" y="310" width="48" height="48" rx="10"/>
      <rect x="262" y="310" width="48" height="48" rx="10"/>
      <rect x="262" y="254" width="48" height="48" rx="10"/>
      <rect x="262" y="198" width="48" height="48" rx="10"/>
      <rect x="318" y="198" width="48" height="48" rx="10"/>
    </g>
    <!-- head -->
    <rect x="374" y="198" width="48" height="48" rx="12" fill="#4F8CFF"/>
    <circle cx="390" cy="214" r="5" fill="#0B1020"/><circle cx="406" cy="214" r="5" fill="#0B1020"/>
    <!-- food -->
    <circle cx="518" cy="458" r="22" fill="#FF5F56"/>
    <rect x="514" y="432" width="6" height="12" rx="3" fill="#16A34A"/>
  </g>

  <!-- controls -->
  <g filter="url(#snakeShadow)" transform="translate(1180,390)">
    <g fill="#141B38" stroke="rgba(255,255,255,0.1)">
      <rect x="60" y="0" width="70" height="70" rx="12"/><rect x="0" y="80" width="70" height="70" rx="12"/><rect x="60" y="80" width="70" height="70" rx="12"/><rect x="120" y="80" width="70" height="70" rx="12"/>
    </g>
    <g fill="#4F8CFF"><path d="M95 20 l14 22 h-28 z"/><path d="M95 130 l14 -22 h-28 z"/><path d="M20 115 l22 -14 v28 z"/><path d="M170 115 l-22 -14 v28 z"/></g>
  </g>

  <text x="80" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#9AA3C7" letter-spacing="0.1em">SNAKE GAME</text>
  <text x="1520" y="930" font-family="'JetBrains Mono', monospace" font-size="14" fill="#16A34A" text-anchor="end">PYTHON &#183; TURTLE GRAPHICS</text>
</svg>
