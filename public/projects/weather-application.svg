<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="wxGlow" cx="50%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#121832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="wxCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2142"/><stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>
    <linearGradient id="wxSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD24F"/><stop offset="100%" stop-color="#FF9B4F"/>
    </linearGradient>
    <linearGradient id="wxAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="wxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0B1020"/>
  <rect width="1600" height="1000" fill="url(#wxGlow)"/>

  <!-- main weather card -->
  <g filter="url(#wxShadow)" transform="translate(320,250)">
    <rect x="0" y="0" width="640" height="500" rx="24" fill="url(#wxCard)" stroke="rgba(255,255,255,0.12)"/>
    <text x="40" y="66" font-family="'Space Grotesk', sans-serif" font-size="26" fill="#F2F4FF" font-weight="700">Rawalpindi</text>
    <text x="40" y="98" font-family="'JetBrains Mono', monospace" font-size="15" fill="#9AA3C7">Partly cloudy &#183; H:32&#176; L:21&#176;</text>

    <!-- sun + cloud -->
    <g transform="translate(120,170)">
      <circle cx="60" cy="60" r="56" fill="url(#wxSun)"/>
      <g stroke="#FFD24F" stroke-width="7" stroke-linecap="round">
        <line x1="60" y1="-18" x2="60" y2="-2"/><line x1="60" y1="122" x2="60" y2="138"/>
        <line x1="-18" y1="60" x2="-2" y2="60"/><line x1="122" y1="60" x2="138" y2="60"/>
        <line x1="8" y1="8" x2="20" y2="20"/><line x1="100" y1="100" x2="112" y2="112"/>
      </g>
      <path d="M150 120 a50 50 0 0 1 96 -8 a40 40 0 0 1 4 80 h-120 a44 44 0 0 1 20 -72 z" fill="#C7D0F0"/>
    </g>
    <text x="440" y="250" font-family="'Space Grotesk', sans-serif" font-size="96" fill="#F2F4FF" font-weight="800" text-anchor="end">28&#176;</text>

    <!-- hourly strip -->
    <g transform="translate(40,360)" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9AA3C7">
      <g><rect x="0" y="0" width="100" height="110" rx="14" fill="#101733"/><text x="50" y="30" text-anchor="middle">12 PM</text><circle cx="50" cy="60" r="16" fill="url(#wxSun)"/><text x="50" y="98" text-anchor="middle" fill="#F2F4FF">30&#176;</text></g>
      <g transform="translate(120,0)"><rect x="0" y="0" width="100" height="110" rx="14" fill="#101733"/><text x="50" y="30" text-anchor="middle">1 PM</text><circle cx="50" cy="60" r="16" fill="#C7D0F0"/><text x="50" y="98" text-anchor="middle" fill="#F2F4FF">31&#176;</text></g>
      <g transform="translate(240,0)"><rect x="0" y="0" width="100" height="110" rx="14" fill="#101733"/><text x="50" y="30" text-anchor="middle">2 PM</text><circle cx="50" cy="60" r="16" fill="#4F8CFF"/><text x="50" y="98" text-anchor="middle" fill="#F2F4FF">29&#176;</text></g>
      <g transform="translate(360,0)"><rect x="0" y="0" width="100" height="110" rx="14" fill="url(#wxAccent)"/><text x="50" y="30" text-anchor="middle" fill="#0B1020">3 PM</text><circle cx="50" cy="60" r="16" fill="#0B1020" opacity="0.5"/><text x="50" y="98" text-anchor="middle" fill="#0B1020">27&#176;</text></g>
      <g transform="translate(480,0)"><rect x="0" y="0" width="80" height="110" rx="14" fill="#101733"/><text x="40" y="30" text-anchor="middle">4 PM</text><circle cx="40" cy="60" r="16" fill="#A855F7"/><text x="40" y="98" text-anchor="middle" fill="#F2F4FF">26&#176;</text></g>
    </g>
  </g>

  <!-- search -->
  <g filter="url(#wxShadow)" transform="translate(1040,320)">
    <rect x="0" y="0" width="360" height="60" rx="30" fill="#0E1430" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="36" cy="30" r="12" fill="none" stroke="#4F8CFF" stroke-width="4"/><line x1="45" y1="39" x2="56" y2="50" stroke="#4F8CFF" stroke-width="4"/>
    <text x="74" y="38" font-family="'Space Grotesk', sans-serif" font-size="17" fill="#5A6291">Search city...</text>
    <rect x="0" y="92" width="360" height="110" rx="18" fill="url(#wxCard)" stroke="rgba(255,255,255,0.12)"/>
    <text x="28" y="134" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9AA3C7">OPENWEATHER API</text>
    <text x="28" y="172" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#F2F4FF">Live &#183; Hourly &#183; Forecast</text>
  </g>

  <text x="80" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#9AA3C7" letter-spacing="0.1em">WEATHER APPLICATION</text>
  <text x="1520" y="930" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4F8CFF" text-anchor="end">JS &#183; OPENWEATHER API</text>
</svg>
