<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="voteGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#121832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="voteCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2142"/><stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>
    <linearGradient id="voteAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="voteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0B1020"/>
  <rect width="1600" height="1000" fill="url(#voteGlow)"/>

  <!-- ballot box -->
  <g filter="url(#voteShadow)" transform="translate(300,330)">
    <path d="M0 120 L260 70 L520 120 L520 440 L0 440 Z" fill="url(#voteCard)" stroke="rgba(255,255,255,0.12)"/>
    <path d="M0 120 L260 70 L520 120 L260 170 Z" fill="#141B38" stroke="rgba(255,255,255,0.12)"/>
    <rect x="180" y="95" width="160" height="16" rx="8" fill="#0B1020"/>
    <!-- ballot going in -->
    <g transform="translate(205,-40) rotate(8)">
      <rect x="0" y="0" width="120" height="150" rx="8" fill="#F2F4FF"/>
      <rect x="18" y="24" width="84" height="10" rx="5" fill="#4F8CFF"/>
      <rect x="18" y="48" width="60" height="8" rx="4" fill="#9AA3C7"/>
      <path d="M22 96 l16 16 l34 -40" fill="none" stroke="#A855F7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="260" y="320" font-family="'Space Grotesk', sans-serif" font-size="30" fill="#C7D0F0" font-weight="700" text-anchor="middle">SECURE BALLOT</text>
  </g>

  <!-- security + results panel -->
  <g filter="url(#voteShadow)" transform="translate(940,300)">
    <rect x="0" y="0" width="420" height="400" rx="18" fill="url(#voteCard)" stroke="rgba(255,255,255,0.12)"/>
    <!-- lock -->
    <g transform="translate(176,36)">
      <rect x="0" y="34" width="68" height="56" rx="10" fill="url(#voteAccent)"/>
      <path d="M12 34 v-14 a22 22 0 0 1 44 0 v14" fill="none" stroke="#4F8CFF" stroke-width="7"/>
      <circle cx="34" cy="58" r="7" fill="#0B1020"/>
    </g>
    <text x="210" y="160" font-family="'JetBrains Mono', monospace" font-size="14" fill="#9AA3C7" text-anchor="middle" letter-spacing="0.1em">CNIC AUTH &#183; CAESAR CIPHER</text>
    <!-- bar results -->
    <g transform="translate(40,190)">
      <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#C7D0F0">Party A</text>
      <rect x="0" y="12" width="340" height="18" rx="9" fill="#101733"/>
      <rect x="0" y="12" width="250" height="18" rx="9" fill="#4F8CFF"/>
      <text x="0" y="66" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#C7D0F0">Party B</text>
      <rect x="0" y="78" width="340" height="18" rx="9" fill="#101733"/>
      <rect x="0" y="78" width="160" height="18" rx="9" fill="#A855F7"/>
      <text x="0" y="132" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#C7D0F0">Party C</text>
      <rect x="0" y="144" width="340" height="18" rx="9" fill="#101733"/>
      <rect x="0" y="144" width="90" height="18" rx="9" fill="#5A6291"/>
    </g>
  </g>

  <text x="80" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#9AA3C7" letter-spacing="0.1em">SECURE VOTING SYSTEM</text>
  <text x="1520" y="930" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4F8CFF" text-anchor="end">C++ &#183; ENCRYPTION &#183; AUTH</text>
</svg>
